<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fanta.css" />
</head>

<body>

<!-- AUTH -->
<section id="auth">
    <div>
        <h2>Login</h2>
        <p>Create an account!</p>
    </div>

    <p id="error" style="display:none;"></p>

    <input id="emailInput" placeholder="Email" />
    <input id="passwordInput" type="password" placeholder="********" />

    <button id="authBtn" onclick="authenticate()">Submit</button>

    <hr />

    <div class="register-content">
        <p>Don’t have an account?</p>
        <button onclick="toggleIsRegister()" id="registerBtn">Sign up</button>
    </div>
</section>

<!-- HEADER -->
<header style="display:none; justify-content: space-between; align-items:center;">
    <h1 class="text-gradient">You have 0 open tasks.</h1>
    <button onclick="logout()">Logout</button>
</header>

<!-- NAV -->
<nav style="display:none;" class="tab-container">
    <button onclick="changeTab('All')" class="tab-button selected-tab">
        <h4>All <span>(0)</span></h4>
    </button>
    <button onclick="changeTab('Open')" class="tab-button">
        <h4>Open <span>(0)</span></h4>
    </button>
    <button onclick="changeTab('Complete')" class="tab-button">
        <h4>Complete <span>(0)</span></h4>
    </button>
    <hr />
</nav>

<!-- MAIN -->
<main style="display:none;"></main>

<script>
let token = localStorage.getItem('token');

let isRegistration = false;
let selectedTab = 'All';
let todos = [];

const apiBase = '/';

// elements
const nav = document.querySelector('nav');
const header = document.querySelector('header');
const main = document.querySelector('main');
const navElements = document.querySelectorAll('.tab-button');
const authContent = document.getElementById('auth');
const textError = document.getElementById('error');
const email = document.getElementById('emailInput');
const password = document.getElementById('passwordInput');
const registerBtn = document.getElementById('registerBtn');
const authBtn = document.getElementById('authBtn');


// ================= AUTH =================

function toggleIsRegister() {
    isRegistration = !isRegistration;

    registerBtn.innerText = isRegistration ? 'Sign in' : 'Sign up';
    document.querySelector('#auth h2').innerText = isRegistration ? 'Sign Up' : 'Login';
    document.querySelector('.register-content p').innerText =
        isRegistration ? 'Already have an account?' : 'Don’t have an account?';
}

async function authenticate() {
    const emailVal = email.value;
    const passVal = password.value;

    if (!emailVal || !passVal) return;

    textError.style.display = 'none';
    authBtn.innerText = 'Authenticating...';

    try {
        const endpoint = isRegistration ? 'auth/register' : 'auth/login';

        const response = await fetch(apiBase + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: emailVal, password: passVal })
        });

        const data = await response.json();

        if (!data.token) throw new Error(data.message || 'Authentication failed');

        token = data.token;
        localStorage.setItem('token', token);

        await fetchTodos();
        showDashboard();

    } catch (err) {
        textError.innerText = err.message;
        textError.style.display = 'block';
    } finally {
        authBtn.innerText = 'Submit';
    }
}


// ================= LOGOUT =================

function logout() {
    localStorage.removeItem('token');
    token = null;

    todos = [];
    selectedTab = 'All';

    nav.style.display = 'none';
    header.style.display = 'none';
    main.style.display = 'none';

    authContent.style.display = 'flex';

    email.value = '';
    password.value = '';
}


// ================= DASHBOARD =================

function showDashboard() {
    nav.style.display = 'block';
    header.style.display = 'flex';
    main.style.display = 'flex';
    authContent.style.display = 'none';

    renderTodos();
}

function updateHeaderText() {
    const open = todos.filter(t => !t.completed).length;
    header.querySelector('h1').innerText =
        open === 1 ? 'You have 1 open task.' : `You have ${open} open tasks.`;
}

function updateNavCount() {
    navElements.forEach(btn => {
        const type = btn.innerText.split(' ')[0];

        const count = todos.filter(t => {
            if (type === 'All') return true;
            if (type === 'Complete') return t.completed;
            return !t.completed;
        }).length;

        btn.querySelector('span').innerText = `(${count})`;
    });
}

function changeTab(tab) {
    selectedTab = tab;

    navElements.forEach(btn => {
        btn.classList.toggle('selected-tab', btn.innerText.includes(tab));
    });

    renderTodos();
}

function renderTodos() {
    updateHeaderText();
    updateNavCount();

    let html = '';

    todos
        .filter(t => selectedTab === 'All'
            ? true
            : selectedTab === 'Complete'
                ? t.completed
                : !t.completed)
        .forEach(todo => {

            const safeTask = todo.task.replace(/'/g, "\\'");

            html += `
            <div class="card todo-item">
                <p>${todo.task}</p>
                <div class="todo-buttons">

                    <button onclick="markDone(${todo.id})" ${todo.completed ? 'disabled' : ''}>
                        Done
                    </button>

                    <button onclick="editTodo(${todo.id}, '${safeTask}')">
                        Edit
                    </button>

                    <button onclick="deleteTodo(${todo.id})">
                        Delete
                    </button>

                </div>
            </div>
            `;
        });

    html += `
    <div class="input-container">
        <input id="todoInput" placeholder="Add task" />
        <button onclick="addTodo()">+</button>
    </div>
    `;

    main.innerHTML = html;
}


// ================= TODOS =================

async function fetchTodos() {
    const response = await fetch(apiBase + 'todos', {
        headers: { 'Authorization': token }
    });

    if (response.status === 401) {
        logout();
        return;
    }

    todos = await response.json();
}

async function addTodo() {
    const input = document.getElementById('todoInput');
    if (!input.value) return;

    await fetch(apiBase + 'todos', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': token
        },
        body: JSON.stringify({ task: input.value })
    });

    input.value = '';
    fetchTodos().then(renderTodos);
}


// ✅ EDIT FLOW

function editTodo(id, currentTask) {
    const newTask = prompt("Edit your task:", currentTask);

    if (!newTask || newTask === currentTask) return;

    updateTodoText(id, newTask);
}

async function updateTodoText(id, newTask) {
    const todo = todos.find(t => t.id === id);

    await fetch(apiBase + 'todos/' + id, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': token
        },
        body: JSON.stringify({
            task: newTask,
            completed: todo.completed
        })
    });

    fetchTodos().then(renderTodos);
}


// ✅ MARK DONE

async function markDone(id) {
    const todo = todos.find(t => t.id === id);

    await fetch(apiBase + 'todos/' + id, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': token
        },
        body: JSON.stringify({
            task: todo.task,
            completed: 1
        })
    });

    fetchTodos().then(renderTodos);
}


// ✅ DELETE

async function deleteTodo(id) {
    await fetch(apiBase + 'todos/' + id, {
        method: 'DELETE',
        headers: { 'Authorization': token }
    });

    fetchTodos().then(renderTodos);
}


// ================= INIT =================

if (token) {
    fetchTodos().then(showDashboard);
}
</script>

</body>
</html>
